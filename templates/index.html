<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <title>$title</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="page-header">
    <div class="page-width heading-row">
      <img class="publication-mark" src="$logo" alt="$logo_alt">
      <div>
        <p class="university-name">$university_name</p>
        <h1>$title</h1>
      </div>
    </div>
  </header>
  <main id="main-content" class="page-width" tabindex="-1">
    <section class="introduction" aria-label="About the publication">
      <div class="introduction-copy">
        <p class="welcome">$welcome</p>
        $introduction
      </div>
      <img class="river-image" src="$hero" alt="$hero_alt">
    </section>
    <div class="$library_class">
      $cover
      <section class="documents" aria-labelledby="documents-heading">
        <h2 id="documents-heading">$documents_heading</h2>
        $issue_list
      </section>
    </div>
    <aside class="site-notice" aria-labelledby="notice-heading">
      <h2 id="notice-heading">$notice_heading</h2>
      <p>$notice_text</p>
    </aside>
  </main>
</body>
</html>
